name: fetch-blocks

on:
  workflow_dispatch:
    inputs:
      first_block:
        description: "First block number"
        required: true
        type: number
      last_block:
        description: "Last block number (span is split into chunks of at most 100)"
        required: true
        type: number
      mode:
        description: "ledger = decode and upload only the ledger (raw stays in the runner and is discarded); raw = upload the raw chunk"
        required: true
        type: choice
        options: [ledger, raw]
        default: ledger

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          FIRST: ${{ inputs.first_block }}
          LAST: ${{ inputs.last_block }}
        run: |
          python3 - << 'EOF'
          import json, os
          first, last = int(float(os.environ["FIRST"])), int(float(os.environ["LAST"]))
          assert last >= first and last - first + 1 <= 100000, "bad range"
          chunks = [{"first": f, "last": min(f + 99, last)}
                    for f in range(first, last + 1, 100)]
          # ~3 min/chunk including state+prices; 50 chunks stays under the 360m job limit.
          batches = [chunks[i:i + 50] for i in range(0, len(chunks), 50)]
          assert len(batches) <= 256, "GitHub Actions matrix limit is 256 jobs"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"batches={json.dumps(batches)}\n")
              fh.write(f"tag=data-{first}-{last}\n")
          print(f"chunks={len(chunks)} batches={len(batches)}")
          EOF
      - name: Create release for this range
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          FIRST: ${{ inputs.first_block }}
          LAST: ${{ inputs.last_block }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Blocks $FIRST-$LAST" \
                 --notes "Base mainnet blocks $FIRST-$LAST (public chain data). Ledger mode uploads a decoded ledger DB per 100-block chunk (native token amounts, no pricing); raw mode uploads the raw chunk DB. Each asset has a .manifest.json with counts and sizes."

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2  # public archive RPC tolerates two state-capture jobs
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, capture and publish batch
        env:
          BATCH: ${{ toJSON(matrix.batch) }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          for c in $(printf '%s' "$BATCH" | jq -c '.[]'); do
            f=$(printf '%s' "$c" | jq -r .first)
            l=$(printf '%s' "$c" | jq -r .last)
            echo "=== chunk ${f}-${l} ==="
            sleep 2  # pace RPC calls between chunks
            python3 scripts/fetch_chunk.py --first "$f" --last "$l" \
              --out "chunk_${f}_${l}.db" --workers 4
            # Ledger needed in both modes: pool ids and tokens come from legs.
            python3 scripts/decode_chunk.py "chunk_${f}_${l}.db" "ledger_${f}_${l}.db"
            python3 scripts/capture_state.py "ledger_${f}_${l}.db" "state_${f}_${l}.json"
            gzip -9 "state_${f}_${l}.json"
            python3 scripts/capture_prices.py "ledger_${f}_${l}.db" "prices_${f}_${l}.json"
            gzip -9 "prices_${f}_${l}.json"
            if [ "$MODE" = "ledger" ]; then
              gzip -9 "ledger_${f}_${l}.db"
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                "ledger_${f}_${l}.db.gz" \
                "ledger_${f}_${l}.db.manifest.json" \
                "state_${f}_${l}.json.gz" \
                "prices_${f}_${l}.json.gz"
              rm -f "chunk_${f}_${l}.db" "chunk_${f}_${l}.db.manifest.json" \
                    "ledger_${f}_${l}.db.gz" "ledger_${f}_${l}.db.manifest.json"
            else
              gzip -9 "chunk_${f}_${l}.db"
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                "chunk_${f}_${l}.db.gz" \
                "chunk_${f}_${l}.db.manifest.json" \
                "state_${f}_${l}.json.gz" \
                "prices_${f}_${l}.json.gz"
              rm -f "chunk_${f}_${l}.db.gz" "chunk_${f}_${l}.db.manifest.json" \
                    "ledger_${f}_${l}.db"
            fi
            rm -f "state_${f}_${l}.json.gz" "prices_${f}_${l}.json.gz"
          done

  notify:
    needs: [plan, fetch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Beacon (ntfy)
        run: |
          curl -s --max-time 15 -d "fetch run ${{ github.run_id }}: plan=${{ needs.plan.result }} fetch=${{ needs.fetch.result }}" https://ntfy.sh/bbc-gha-f7b42dc9 > /dev/null || true
